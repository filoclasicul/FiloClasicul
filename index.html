
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicționar — Greacă veche și latină</title>
  
  <!-- Fonturi moderne pentru interfață, cu serif discret pentru citate -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg-page: #f4f7fc;
      --bg-card: #ffffff;
      --border-color: #dce5f2;
      --border-accent: #a9b8f5;
      --text-main: #182238;
      --text-muted: #66738b;
      --crimson: #635bdb;
      --crimson-hover: #4e46c4;
      --gold: #078f9c;
      --gold-light: #eef1ff;
      --morph-bg: #eef5ff;
      --morph-border: #b8c9f3;
      --highlight: #e4e8ff;
      --shadow-sm: 0 4px 14px rgba(37, 54, 103, 0.06);
      --shadow-md: 0 14px 38px rgba(37, 54, 103, 0.09);
      --font-body: 'DM Sans', 'Segoe UI', sans-serif;
      --font-title: 'Manrope', 'Segoe UI', sans-serif;
      --font-quote: 'Playfair Display', serif;
    }

    [data-theme="dark"], .dark {
      color-scheme: dark;
      --bg-page: #0b1020;
      --bg-card: #111a2d;
      --border-color: #26344e;
      --border-accent: #43537b;
      --text-main: #edf2ff;
      --text-muted: #a3b0c9;
      --crimson: #82e8ef;
      --crimson-hover: #a0f4f3;
      --gold: #b39aff;
      --gold-light: #1b2540;
      --morph-bg: #12243a;
      --morph-border: #34506d;
      --highlight: #38436c;
      --shadow-sm: 0 5px 16px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 18px 46px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      font-size: 17px;
      transition: background-color 0.25s, color 0.25s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(ellipse at 12% 0%, rgba(111, 101, 230, 0.08), transparent 34%),
        radial-gradient(ellipse at 92% 18%, rgba(19, 180, 190, 0.06), transparent 30%);
    }

    header {
      background: var(--bg-card);
      border-bottom: 2px solid var(--border-accent);
      padding: 0.9rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-block {
      cursor: pointer;
    }

    .site-title {
      font-family: var(--font-title);
      font-size: 1.55rem;
      letter-spacing: 0.12em;
      color: var(--crimson);
      font-weight: 800;
      line-height: 1.1;
      display: block;
    }

    .site-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-action {
      background: var(--gold-light);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--border-accent);
      color: #fff;
    }

    main {
      max-width: 1480px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
      flex: 1;
      width: 100%;
    }

    .page-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "content";
      align-items: start;
      gap: 1.25rem;
    }

    .content-column {
      grid-area: content;
      min-width: 0;
    }

    .sidebar-panel {
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-title {
      margin-bottom: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-title);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .main-sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .menu-group-label {
      color: var(--text-muted);
      font-family: var(--font-title);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .menu-button {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
    }

    .search-modes {
      margin-bottom: 1rem;
    }

    .search-modes .main-sidebar-menu {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }

    .search-modes .menu-group {
      flex: 1 1 260px;
    }

    .menu-group-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .search-modes .menu-button {
      width: auto;
      justify-content: center;
      text-align: center;
    }

    .mode-chip {
      background: var(--bg-page);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .mode-chip:hover {
      border-color: var(--border-accent);
      color: var(--text-main);
    }

    .mode-chip.active {
      background: var(--crimson);
      border-color: var(--crimson);
      color: #ffffff;
      font-weight: bold;
      box-shadow: var(--shadow-sm);
    }

    /* Căsuță de căutare */
    .search-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.3rem;
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-bar-wrap {
      display: flex;
      position: relative;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 4.5rem 0.85rem 1.1rem;
      font-size: 1.15rem;
      font-family: var(--font-body);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-page);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px rgba(139, 30, 30, 0.15);
    }

    .search-lower-layout {
      margin-top: 0.85rem;
    }

    .search-section.has-active-search .search-lower-layout {
      margin-top: 0;
    }

    @media (max-width: 1050px) {
      .page-layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "content";
      }

    }

    @media (max-width: 640px) {
      .page-layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "content";
        gap: 1rem;
      }
    }

    .search-actions {
      position: absolute;
      right: 0.75rem;
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.05rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      transition: color 0.2s, background-color 0.2s;
    }

    .icon-btn:hover {
      color: var(--crimson);
      background: var(--gold-light);
    }

    /* Dropdown Autocomplete / Recomandări la fiecare literă */
    .autocomplete-dropdown {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 0.3rem);
      background: var(--bg-card);
      border: 2px solid var(--border-accent);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      max-height: 220px;
      overflow-y: auto;
      z-index: 150;
    }

    .autocomplete-dropdown.active {
      display: block;
    }

    .dropdown-header {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      font-family: var(--font-title);
      color: var(--text-muted);
      background: var(--gold-light);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }

    .dropdown-item {
      min-height: 2.15rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.15s;
    }

    .dropdown-item > div {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background-color: var(--gold-light);
    }

    .dropdown-lemma {
      flex: 0 0 auto;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--crimson);
      white-space: nowrap;
    }

    .dropdown-desc {
      flex: 1;
      min-width: 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tastatură virtuală diacritice */
    .virtual-keyboard {
      display: none;
      margin-top: 0.9rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
    }

    .virtual-keyboard.active {
      display: block;
    }

    .kb-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-family: var(--font-title);
    }

    .kb-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .kb-key {
      background: var(--bg-page);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.25rem 0.55rem;
      font-size: 1rem;
      border-radius: 3px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }

    .kb-key:hover {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    /* Alertă lematizator */
    .morph-notice {
      display: none;
      background: var(--morph-bg);
      border: 1px solid var(--morph-border);
      border-left: 5px solid var(--gold);
      padding: 1rem 1.2rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .morph-notice.active {
      display: block;
    }

    /* Card Rezultate Căutare Revers */
    .reverse-results-container {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }

    .reverse-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--gold);
      border-radius: 6px;
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .reverse-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--crimson);
      border-left-color: var(--crimson);
    }

    .reverse-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.4rem;
    }

    .reverse-lemma {
      font-size: 1.5rem;
      color: var(--crimson);
      font-weight: bold;
    }

    .reverse-match-text {
      font-size: 1rem;
      margin-top: 0.4rem;
      background: var(--bg-page);
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      border: 1px dashed var(--border-color);
    }

    /* Card Articol Dicționar */
    .entry-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: var(--shadow-md);
      position: relative;
      margin-bottom: 2rem;
    }

    .entry-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.1rem;
      margin-bottom: 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .lemma-title {
      font-size: 2.3rem;
      color: var(--crimson);
      font-weight: 700;
      line-height: 1.1;
    }

    .lemma-badges {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-family: var(--font-title);
    }

    .badge-lang {
      background: var(--crimson);
      color: #fff;
    }

    .badge-pos {
      background: var(--gold-light);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
    }

    .etymology-box {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      padding: 0.6rem 0.9rem;
      background: var(--bg-page);
      border-left: 3px solid var(--border-accent);
      border-radius: 0 4px 4px 0;
      font-size: 0.95rem;
    }

    .section-title {
      font-family: var(--font-title);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin: 1.4rem 0 0.75rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .definitions-list {
      list-style-position: inside;
      padding-left: 0.3rem;
    }

    .definition-item {
      margin-bottom: 0.6rem;
    }

    .definition-text,
    .definition-subsection {
      display: block;
    }

    .definition-subsection {
      position: relative;
      margin-top: 0.45rem;
      padding: 0.45rem 0.65rem;
      border-left: 2px solid var(--border-accent);
      border-radius: 0 6px 6px 0;
      background: var(--bg-page);
    }

    .definition-subsection.major {
      border-left-color: var(--crimson);
      background: var(--gold-light);
    }

    .definition-subsection.numbered {
      margin-left: 0.85rem;
    }

    .definition-subsection.lettered {
      margin-left: 1.7rem;
      border-left-color: var(--gold);
    }

    .definition-marker {
      display: inline-block;
      margin-right: 0.4rem;
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--crimson);
      font-weight: 700;
    }

    .definition-subsection.lettered .definition-marker {
      color: var(--gold);
    }

    .definition-example {
      font-style: italic;
    }

    .definition-num {
      font-weight: bold;
      color: var(--crimson);
      margin-right: 0.35rem;
    }

    .citation-card {
      margin: 0.75rem 0;
      padding: 0.8rem 1.1rem;
      background: var(--bg-page);
      border-left: 3px solid var(--crimson);
      border-radius: 0 6px 6px 0;
    }

    .citation-original {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
    }

    .citation-trans {
      color: var(--text-muted);
      font-style: italic;
      font-family: var(--font-quote);
      font-size: 0.95rem;
    }

    .citation-source {
      text-align: right;
      font-size: 0.82rem;
      font-family: var(--font-title);
      color: var(--gold);
      margin-top: 0.35rem;
    }

    .paradigm-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.7rem;
      font-size: 0.92rem;
    }

    .paradigm-table th, .paradigm-table td {
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.75rem;
      text-align: left;
    }

    .paradigm-table th {
      background: var(--gold-light);
      font-family: var(--font-title);
      font-size: 0.82rem;
    }

    footer {
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 1.25rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      background: var(--bg-card);
      margin-top: auto;
    }

    .dictionary-load-error {
      margin-top: 0.75rem;
      color: var(--crimson);
    }

    header {
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 5px 22px rgba(24, 34, 56, 0.045);
    }

    .site-title {
      letter-spacing: 0.08em;
    }

    .site-subtitle {
      white-space: nowrap;
      font-size: 0.68rem;
    }

    .btn-action {
      border-radius: 10px;
      border-color: var(--border-color);
      transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .btn-action:hover {
      transform: translateY(-1px);
      border-color: var(--border-accent);
    }

    .mode-chip {
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      font-weight: 600;
    }

    .mode-chip.active {
      background: linear-gradient(110deg, #635bdb, #527ee8);
      border-color: transparent;
      box-shadow: 0 5px 14px rgba(99, 91, 219, 0.2);
    }

    .search-section {
      border-radius: 18px;
      box-shadow: var(--shadow-md);
    }

    .search-input {
      border-radius: 12px;
      background: var(--bg-page);
    }

    .search-input:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 4px rgba(99, 91, 219, 0.12), 0 8px 24px rgba(99, 91, 219, 0.08);
    }

    .search-input:focus-visible {
      outline: none;
    }

    .autocomplete-dropdown {
      border-radius: 14px;
      border-width: 1px;
      overflow: hidden auto;
    }

    .icon-btn,
    .kb-key {
      border-radius: 9px;
    }

    .morph-notice {
      border-radius: 14px;
    }

    .reverse-item-card {
      border-radius: 14px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .reverse-item-card:hover {
      box-shadow: var(--shadow-md);
    }

    .entry-card {
      border-radius: 18px;
      overflow: hidden;
    }

    .entry-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--crimson), var(--gold), transparent 88%);
    }

    .lemma-title {
      letter-spacing: -0.035em;
    }

    .badge {
      border-radius: 999px;
    }

    .badge-lang {
      background: linear-gradient(110deg, var(--crimson), var(--gold));
    }

    .badge-pos {
      border-radius: 999px;
    }

    .etymology-box,
    .citation-card {
      border-radius: 0 12px 12px 0;
    }

    .paradigm-table th:first-child {
      border-top-left-radius: 8px;
    }

    footer {
      border-top: 1px solid var(--border-color);
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    [data-theme="dark"] body {
      background-image: radial-gradient(ellipse at 12% 0%, rgba(124, 102, 255, 0.12), transparent 36%),
        radial-gradient(ellipse at 92% 18%, rgba(40, 210, 218, 0.08), transparent 32%);
    }

    [data-theme="dark"] header {
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.2);
    }

    [data-theme="dark"] .mode-chip.active {
      background: linear-gradient(110deg, #82e8ef, #b39aff);
      color: #0b1020;
      box-shadow: 0 5px 18px rgba(130, 232, 239, 0.14);
    }

    [data-theme="dark"] .entry-card::before {
      opacity: 0.8;
    }

    @media (max-width: 640px) {
      body {
        font-size: 16px;
      }

      header {
        padding: 0.75rem 1rem;
      }

      .site-title {
        font-size: 1.3rem;
      }

      main {
        margin-top: 1rem;
        padding: 0 0.85rem;
      }

      .modes-container,
      .search-section {
        padding: 0.9rem;
      }

      .search-input {
        padding-right: 5.75rem;
      }

      .modes-group-label {
        min-width: 100%;
      }

      .mode-chip {
        font-size: 0.8rem;
      }

      .entry-card {
        padding: 1.25rem;
      }

      .lemma-title {
        font-size: 2rem;
      }

      .reverse-header {
        align-items: flex-start;
        gap: 0.5rem;
        flex-direction: column;
      }

    @media (prefers-reduced-motion: reduce) {

  <footer>
    Un spațiu interactiv pentru cuvintele grecești și latine.
  </footer>

  <script>
    let currentMode = 'omnia-dir';
    const remoteDictionaryCache = new Map();
    let searchRequestId = 0;
    const lexiconData = Object.create(null);

    function cleanUniversal(str) {
      if (!str) return '';
      return str
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[āă]/gi, 'a')
        .replace(/[ēĕ]/gi, 'e')
        .replace(/[īĭ]/gi, 'i')
        .replace(/[ōŏ]/gi, 'o')
        .replace(/[ūŭ]/gi, 'u')
        .replace(/[șş]/gi, 's')
        .replace(/[țţ]/gi, 't')
        .replace(/[îâ]/gi, 'i')
        .toLowerCase()
        .trim();
    }

    function transliterateGreek(str) {
      const greekLetters = {
        "α": "a", "β": "b", "γ": "g", "δ": "d", "ε": "e",
        "ζ": "z", "η": "e", "θ": "th", "ι": "i", "κ": "k",
        "λ": "l", "μ": "m", "ν": "n", "ξ": "x", "ο": "o",
        "π": "p", "ρ": "r", "σ": "s", "ς": "s", "τ": "t",
        "υ": "y", "φ": "ph", "χ": "ch", "ψ": "ps", "ω": "o"
      };
      const normalized = cleanUniversal(str).replace(/ς/g, "σ");
      return Array.from(normalized, letter => greekLetters[letter] || letter).join("");
    }

    function greekSearchKey(str) {
      const cleanText = cleanUniversal(str);
      const containsGreek = /[\u0370-\u03ff\u1f00-\u1fff]/.test(cleanText);
      return containsGreek
        ? transliterateGreek(cleanText)
        : cleanText.replace(/kh/g, "ch").replace(/ks/g, "x");
    }

    function matchesSearchText(text, query) {
      return greekSearchKey(text) === greekSearchKey(query);
    }

       function greekDocumentKeyForLetter(letter) {
      const normalized = String(letter || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const greekLetterMap = {
        'α': 'alpha', 'β': 'beta', 'γ': 'gamma', 'δ': 'delta', 'ε': 'epsilon', 'ζ': 'zeta', 'η': 'eta',
        'θ': 'theta', 'ι': 'iota', 'κ': 'kappa', 'λ': 'lambda', 'μ': 'mu', 'ν': 'nu', 'ξ': 'xi',
        'ο': 'omicron', 'π': 'pi', 'ρ': 'rho', 'σ': 'sigma', 'ς': 'sigma', 'τ': 'tau', 'υ': 'upsilon',
        'φ': 'phi', 'χ': 'chi', 'ψ': 'psi', 'ω': 'omega'
      };
      return greekLetterMap[normalized] || normalized || 'a';
    }

    function buildDictionaryTargets(query) {
      const raw = query.trim();
      if (!raw) return [];

      const firstLetter = [...raw].find(ch => /[\p{L}]/u.test(ch)) || raw[0] || 'a';
      const normalizedFirstLetter = String(firstLetter).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const isGreek = /[\u0370-\u03ff\u1f00-\u1fff]/.test(raw);
      const language = currentMode === 'greek-dir' || (currentMode === 'omnia-dir' && isGreek)
        ? 'gr'
        : 'lat';
      const fileKey = language === 'gr'
        ? greekDocumentKeyForLetter(firstLetter)
        : (normalizedFirstLetter || 'a');

      const directoryNames = [
        language,
        `${language}.json`,
        `data/${language}`,
        `data/${language}.json`
      ];

      const fileNames = [
        fileKey,
        `${fileKey}.json`,
        normalizedFirstLetter,
        `${normalizedFirstLetter}.json`,
        String(firstLetter),
        `${String(firstLetter)}.json`
      ].filter((value, index, arr) => value && arr.indexOf(value) === index);

      const seen = new Set();
      const targets = [];

      directoryNames.forEach(dirName => {
        fileNames.forEach(fileName => {
          const actualName = fileName.endsWith('.json') ? fileName : `${fileName}.json`;
          const path = `${dirName}/${actualName}`;
          if (!seen.has(path)) {
            seen.add(path);
            targets.push({ language, path });
          }
        });
      });

      const legacyAlternative = `data/${language}.json/${encodeURIComponent(fileKey)}.json`;
      if (!seen.has(legacyAlternative)) {
        seen.add(legacyAlternative);
        targets.push({ language, path: legacyAlternative });
      }

      return targets;
    }

    function normalizeRemoteEntry(lemma, entry, language) {
      if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
        throw new TypeError(`Intrarea „${lemma}” nu este un obiect valid.`);
      }

      const rawForms = entry.forme ?? entry.forms ?? entry.variante ?? [];
      const searchForms = Array.isArray(rawForms)
        ? rawForms.map(String)
        : String(rawForms).split(/[;,]/).map(form => form.trim()).filter(Boolean);
      const rawDefinitions = entry.definitie ?? entry.definitie_ro ?? entry.defs ?? [];
      const definitions = (Array.isArray(rawDefinitions) ? rawDefinitions : [rawDefinitions])
        .map(String)
        .filter(Boolean);
      const escape = value => escapeHtml(String(value ?? ''));

      return {
        ...entry,
        lemmaKey: lemma,
        id: escape(entry.id ?? lemma),
        lang: language === 'gr' ? 'Greacă Veche' : 'Latină',
        pos: escape(entry.pos ?? 'Parte de vorbire nespecificată'),
        forms: escape(Array.isArray(rawForms) ? rawForms.join(', ') : rawForms),
        indicatii: escape(entry.indicatii ?? ''),
        redirect: escape(entry.trimite_la ?? ''),
        searchForms,
        etym: escape(entry.etym ?? entry.etimologie ?? ''),
        defs: definitions.map(escape),
        citations: Array.isArray(entry.citations) ? entry.citations.map(citation => ({
          text: escape(citation.text),
          trans: escape(citation.trans),
          author: escape(citation.author)
        })) : [],
        paradigm: Array.isArray(entry.paradigm)
          ? entry.paradigm.map(row => Array.isArray(row) ? row.map(escape) : [])
          : []
      };
    }

    async function loadRemoteDictionary(query) {
      const targets = buildDictionaryTargets(query);
      if (!targets.length) return;

      let lastError = null;

      for (const target of targets) {
        if (!remoteDictionaryCache.has(target.path)) {
          const request = fetch(target.path).then(async response => {
            if (!response.ok) {
              throw new Error(`Răspuns HTTP ${response.status}`);
            }
            const body = await response.text();
            try {
              return JSON.parse(body);
            } catch (error) {
              if (body.trimStart().startsWith('<')) {
                throw new Error('serverul a returnat o pagină HTML, nu fișierul JSON cerut');
              }
              throw error;
            }
          });
          remoteDictionaryCache.set(target.path, request);
        }

        try {
          const data = await remoteDictionaryCache.get(target.path);
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            throw new TypeError('Fișierul JSON trebuie să conțină un obiect cu intrări indexate după lemă.');
          }
          for (const [lemma, entry] of Object.entries(data)) {
            if (!Object.prototype.hasOwnProperty.call(lexiconData, lemma)) {
              lexiconData[lemma] = normalizeRemoteEntry(lemma, entry, target.language);
            }
          }
          return;
        } catch (error) {
          lastError = new Error(`${target.path}: ${error.message}`);
          remoteDictionaryCache.delete(target.path);
        }
      }

      throw new Error(`Nu s-a putut încărca niciun fișier pentru ${query}: ${lastError ? lastError.message : 'eroare necunoscută'}`);
    }

      return {
        ...entry,
        lemmaKey: lemma,
        id: escape(entry.id ?? lemma),
        lang: language === 'gr' ? 'Greacă Veche' : 'Latină',
        pos: escape(entry.pos ?? 'Parte de vorbire nespecificată'),
        forms: escape(Array.isArray(rawForms) ? rawForms.join(', ') : rawForms),
        indicatii: escape(entry.indicatii ?? ''),
        redirect: escape(entry.trimite_la ?? ''),
        searchForms,
        etym: escape(entry.etym ?? entry.etimologie ?? ''),
        defs: definitions.map(escape),
        citations: Array.isArray(entry.citations) ? entry.citations.map(citation => ({
          text: escape(citation.text),
          trans: escape(citation.trans),
          author: escape(citation.author)
        })) : [],
        paradigm: Array.isArray(entry.paradigm)
          ? entry.paradigm.map(row => Array.isArray(row) ? row.map(escape) : [])
          : []
      };
    }

    async function loadRemoteDictionary(query) {
      const targets = buildDictionaryTargets(query);
      if (!targets.length) return;

      let lastError = null;

      for (const target of targets) {
        if (!remoteDictionaryCache.has(target.path)) {
          const request = fetch(target.path).then(response => {
            if (!response.ok) {
              throw new Error(`Răspuns HTTP ${response.status}`);
            }
            return response.json();
          });
          remoteDictionaryCache.set(target.path, request);
        }

        try {
          const data = await remoteDictionaryCache.get(target.path);
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            throw new TypeError('Fișierul JSON trebuie să conțină un obiect cu intrări indexate după lemă.');
          }
          for (const [lemma, entry] of Object.entries(data)) {
            if (!Object.prototype.hasOwnProperty.call(lexiconData, lemma)) {
              lexiconData[lemma] = normalizeRemoteEntry(lemma, entry, target.language);
            }
          }
          return;
        } catch (error) {
          lastError = error;
          remoteDictionaryCache.delete(target.path);
        }
      }

      throw new Error(`Nu s-a putut încărca niciun fișier pentru ${query}: ${lastError ? lastError.message : 'eroare necunoscută'}`);
    }

    function setSearchMode(mode) {
      currentMode = mode;
      const allModeButtons = ['omnia-dir', 'greek-dir', 'latin-dir', 'omnia-rev', 'greek-rev', 'latin-rev'];
      allModeButtons.forEach(m => {
        const btn = document.getElementById('btn-' + m);
        if (btn) btn.classList.toggle('active', m === mode);
      });

      const input = document.getElementById('searchInput');
      const kbdBtn = document.getElementById('kbdToggleBtn');
      const searchSubmitBtn = document.getElementById('searchSubmitBtn');
      const kbdPanel = document.getElementById('keyboardPanel');

      kbdPanel.classList.remove('active');
      document.getElementById('autocompleteDropdown').classList.remove('active');

      const isReverse = mode.endsWith('-rev');
      kbdBtn.style.display = isReverse ? "none" : "inline-block";
      searchSubmitBtn.style.display = isReverse ? "inline-block" : "none";

      if (!isReverse) {
        input.placeholder = "Tastează o literă sau un cuvânt";
      } else {
        input.placeholder = "Tastează un cuvânt în română...";
      }

      if (isReverse) {
        document.getElementById('autocompleteDropdown').classList.remove('active');
        document.getElementById('dictionaryDisplay').innerHTML = '';
      } else {
        handleSearchInput(input.value);
      }
      input.focus();
    }

    function handleSearchInput(query) {
      if (currentMode.endsWith('-rev')) {
        document.getElementById('autocompleteDropdown').classList.remove('active');
        document.getElementById('dictionaryDisplay').innerHTML = '';
        updateHomeView(query);
        return;
      }

      const requestId = ++searchRequestId;
      updateLiveSuggestions(query);
      handleSearch(query);
      if (!query.trim()) return;

      loadRemoteDictionary(query).then(() => {
        if (requestId !== searchRequestId || currentMode.endsWith('-rev')) return;
        updateLiveSuggestions(query);
        handleSearch(query);
      }).catch(error => {
        if (requestId !== searchRequestId || currentMode.endsWith('-rev')) return;
        const display = document.getElementById('dictionaryDisplay');
        const message = document.createElement('p');
        message.className = 'dictionary-load-error';
        message.textContent = error.message;
        display.appendChild(message);
      });
    }

    function submitSearch() {
      if (!currentMode.endsWith('-rev')) return;
      document.getElementById('autocompleteDropdown').classList.remove('active');
      runReverseSearch(document.getElementById('searchInput').value);
    }

    function handleSearchKeydown(event) {
      if (event.key === 'Enter' && currentMode.endsWith('-rev')) {
        event.preventDefault();
        submitSearch();
      }
    }

    function updateHomeView(query) {
      document.querySelector('.search-section').classList.toggle('has-active-search', Boolean(query.trim()));
      document.querySelector('.page-layout').classList.toggle('has-active-search', Boolean(query.trim()));
    }

    function updateLiveSuggestions(query) {
      const dropdown = document.getElementById('autocompleteDropdown');
      const list = document.getElementById('dropdownList');
      const title = document.getElementById('dropdownTitle');

      if (!query || query.trim() === '') {
        dropdown.classList.remove('active');
        return;
      }

      const raw = query.trim();
      const cleanQ = greekSearchKey(raw);
      const matches = [];

      for (let lemma in lexiconData) {
        const item = lexiconData[lemma];
        if (currentMode === 'greek-dir' && item.lang !== "Greacă Veche") continue;
        if (currentMode === 'latin-dir' && item.lang !== "Latină") continue;

        const matchesLemma = greekSearchKey(lemma).startsWith(cleanQ);
        const matchesForm = item.searchForms?.some(form => greekSearchKey(form).startsWith(cleanQ));
        if (matchesLemma || matchesForm) {
          matches.push(item);
        }
      }

      if (matches.length > 0) {
        matches.sort((a, b) => greekSearchKey(a.id).localeCompare(greekSearchKey(b.id), 'en', { sensitivity: 'base' }));
        dropdown.classList.add('active');
        title.innerText = `Recomandări pentru „${raw}” (${matches.length})`;
        const suggestions = matches.slice(0, 5);
        list.innerHTML = suggestions.map(item => `
          <div class="dropdown-item">
            <div>
              <span class="dropdown-lemma${item.lang === 'Greacă Veche' ? ' greek-text' : ''}">${item.id}</span>
              <span class="dropdown-desc">${item.defs[0] || item.pos}</span>
            </div>
          </div>
        `).join('');
        list.querySelectorAll('.dropdown-item').forEach((element, index) => {
          element.addEventListener('click', () => {
            selectSuggestion(suggestions[index].lemmaKey ?? suggestions[index].id);
          });
        });
      } else {
        dropdown.classList.remove('active');
      }
    }

    function selectSuggestion(lemma) {
      document.getElementById('searchInput').value = lemma;
      document.getElementById('autocompleteDropdown').classList.remove('active');
      updateHomeView(lemma);
      renderEntry(lemma);
    }

    function handleSearch(query) {
      updateHomeView(query);
      if (currentMode.endsWith('-dir')) {
        runDirectSearch(query);
      } else {
        runReverseSearch(query);
      }
    }

    function italicizeLatinExamples(text) {
      const latinEnding = /\b[\p{L}]+(?:āre|ēre|īre|ō|um|us|ae|is|ibus|orum|arum|are|ere|ire|isse|ent|ant)\b/iu;
      const latinFunctionWords = /\b(?:ab|ad|ante|apud|cum|de|ex|in|inter|per|post|pro|sub|super|et|non|qui|quae|quod|ut|ne|est|sunt|esse)\b/gi;

      return text.replace(/(^|[:;=]\s*)([^,;:=]+)(?=,)/g, (match, prefix, candidate) => {
        if (/[ăâîșț]/i.test(candidate) || candidate.trim().split(/\s+/).length < 2) return match;

        const functionWordCount = (candidate.match(latinFunctionWords) || []).length;
        if (!latinEnding.test(candidate) && functionWordCount < 2) return match;

        return `${prefix}<em class="definition-example">${candidate}</em>`;
      });
    }

    function formatDefinition(text) {
      const markerPattern = /(^|\s)(¶\s*\d+\.|[IVX]+\.|\d+\.|[a-z]\))/g;
      const markers = [];
      const sections = [];
      let cursor = 0;
      let match;

      while ((match = markerPattern.exec(text)) !== null) {
        markers.push({
          index: match.index,
          end: markerPattern.lastIndex,
          label: match[2].trim()
        });
      }

      markers.forEach((currentMarker, index) => {
        const prefix = text.slice(cursor, currentMarker.index).trim();
        if (prefix) sections.push(`<span class="definition-text">${italicizeLatinExamples(prefix)}</span>`);

        const contentEnd = markers[index + 1]?.index ?? text.length;
        const content = text.slice(currentMarker.end, contentEnd).trim();
        const markerClass = currentMarker.label.startsWith('¶') || /^\d/.test(currentMarker.label)
          ? 'numbered'
          : /^[a-z]\)/.test(currentMarker.label)
            ? 'lettered'
            : 'major';

        if (content) {
          sections.push(
            `<span class="definition-subsection ${markerClass}"><span class="definition-marker">${currentMarker.label}</span>${italicizeLatinExamples(content)}</span>`
          );
        }
        cursor = contentEnd;
      });

      const remainder = text.slice(cursor).trim();
      if (remainder) sections.push(`<span class="definition-text">${italicizeLatinExamples(remainder)}</span>`);
      return sections.length ? sections.join('') : `<span class="definition-text">${italicizeLatinExamples(text)}</span>`;
    }

    function runDirectSearch(query) {
      const display = document.getElementById('dictionaryDisplay');

      if (!query || query.trim() === '') {
        display.innerHTML = '';
        return;
      }

      const raw = query.trim();

      let matchedLemma = null;
      for (let lemma in lexiconData) {
        const item = lexiconData[lemma];
        if (currentMode === 'greek-dir' && item.lang !== "Greacă Veche") continue;
        if (currentMode === 'latin-dir' && item.lang !== "Latină") continue;

        const matchesForm = item.searchForms && item.searchForms.some(form => matchesSearchText(form, raw));
        if (lemma === raw || matchesSearchText(lemma, raw) || matchesForm) {
          matchedLemma = lemma;
          break;
        }
      }

      if (matchedLemma) {
        renderEntry(matchedLemma);
      } else {
        display.innerHTML = '';
      }
    }

    function runReverseSearch(query) {
      const display = document.getElementById('dictionaryDisplay');

      if (!query || query.trim().length < 2) {
        display.innerHTML = '';
        return;
      }

      const raw = query.trim();
      const cleanQ = cleanUniversal(raw);
      const matches = [];

      for (let key in lexiconData) {
        const item = lexiconData[key];
        if (currentMode === 'greek-rev' && item.lang !== "Greacă Veche") continue;
        if (currentMode === 'latin-rev' && item.lang !== "Latină") continue;

        const matchedDefs = [];
        item.defs.forEach((def, idx) => {
          if (cleanUniversal(def).includes(cleanQ)) {
            matchedDefs.push({ num: idx + 1, text: def });
          }
        });

        if (matchedDefs.length > 0) {
          matches.push({
            lemma: item.lemmaKey ?? item.id,
            displayLemma: item.id,
            lang: item.lang,
            pos: item.pos,
            forms: item.forms,
            defs: matchedDefs
          });
        }
      }

      if (matches.length === 0) {
        display.innerHTML = '';
        return;
      }

      let html = `<div class="reverse-results-container">`;
      matches.forEach(m => {
        html += `
          <div class="reverse-item-card">
            <div class="reverse-header">
              <div>
                <span class="reverse-lemma">${m.displayLemma}</span>
                <span class="badge badge-lang" style="margin-left: 0.5rem;">${m.lang}</span>
                <span class="badge badge-pos">${m.pos}</span>
              </div>
              <span style="font-size: 0.85rem; color: var(--crimson); font-weight: bold;">Vezi fișa ➔</span>
            </div>
            <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem;"><em>${m.forms}</em></div>
            <div class="reverse-match-text">
              ${m.defs.map(d => `<div><strong>${d.num}.</strong> ${formatDefinition(d.text)}</div>`).join('')}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      display.innerHTML = html;
      display.querySelectorAll('.reverse-item-card').forEach((element, index) => {
        element.addEventListener('click', () => selectSuggestion(matches[index].lemma));
      });
    }

    function renderEntry(lemmaKey) {
      const data = lexiconData[lemmaKey];
      const display = document.getElementById('dictionaryDisplay');
      if (!data) return;

      let citationsHtml = '';
      if (data.citations && data.citations.length > 0) {
        citationsHtml += `<div class="section-title">Citate & Atestări Clasice</div>`;
        data.citations.forEach(cit => {
          citationsHtml += `
            <div class="citation-card">
              <div class="citation-original">${cit.text}</div>
              <div class="citation-trans">${cit.trans}</div>
              <div class="citation-source">— ${cit.author}</div>
            </div>
          `;
        });
      }

      let paradigmHtml = '';
      if (data.paradigm && data.paradigm.length > 0) {
        paradigmHtml += `
          <div class="section-title">Paradigmă Gramaticală</div>
          <table class="paradigm-table">
            <thead><tr>${data.paradigm[0].map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody>
              ${data.paradigm.slice(1).map(row => `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        `;
      }

      display.innerHTML = `
        <article class="entry-card">
          <div class="entry-header">
            <div>
              <h1 class="lemma-title">${data.id}</h1>
              <div class="lemma-badges">
                <span class="badge badge-lang">${data.lang}</span>
                <span class="badge badge-pos">${data.pos}</span>
              </div>
            </div>
          </div>

          ${(data.forms || data.indicatii || data.etym) ? `
            <div class="etymology-box">
              ${data.forms ? `<strong>Forme canonice:</strong> ${data.forms}<br>` : ''}
              ${data.indicatii ? `<strong>Indicații:</strong> ${data.indicatii}<br>` : ''}
              ${data.etym ? `<strong>Etimologie & Origine:</strong> ${data.etym}` : ''}
            </div>
          ` : ''}

          ${data.redirect ? `<div class="morph-notice active">Formă flexionată. Trimite la: <strong>${data.redirect}</strong></div>` : ''}

          <div class="section-title">Definiții & Sensuri (Limba Română)</div>
          <ol class="definitions-list">
            ${data.defs.map((d, idx) => `<li class="definition-item"><span class="definition-num">${idx + 1}.</span> ${formatDefinition(d)}</li>`).join('')}
          </ol>

          ${citationsHtml}
          ${paradigmHtml}
        </article>
      `;
    }

    function clearSearch() {
      searchRequestId++;
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('autocompleteDropdown').classList.remove('active');
      input.focus();
      handleSearch('');
    }

    function resetToHome() {
      setSearchMode('omnia-dir');
      clearSearch();
    }

    function toggleKeyboard() {
      document.getElementById('keyboardPanel').classList.toggle('active');
    }

    function insertChar(char) {
      const input = document.getElementById('searchInput');
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.substring(0, start) + char + input.value.substring(end);
      input.focus();
      input.selectionStart = input.selectionEnd = start + char.length;
      handleSearchInput(input.value);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      if (target === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
      document.getElementById('themeToggleBtn').innerText = target === 'dark' ? 'Mod luminos' : 'Mod nocturn';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-section')) {
        document.getElementById('autocompleteDropdown').classList.remove('active');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setSearchMode('omnia-dir');
    });
  </script>
</body>
</html>
